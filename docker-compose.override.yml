# Nur fuer die lokale Entwicklung. Docker Compose laedt diese Datei automatisch,
# sobald sie neben docker-compose.yml liegt: "docker compose up -d --build" baut
# dann aus dem Checkout, statt das Image von GHCR zu ziehen. Auf einem Server
# existiert die Datei nicht, dort bleibt docker-compose.yml unveraendert gueltig.
services:
  spesenfuchs:
    build: .
